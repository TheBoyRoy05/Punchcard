<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Punchcard</title>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="picker.js"></script>
  </head>
  <body class="pc:m-0 pc:flex pc:h-screen pc:flex-col pc:bg-surface pc:font-ui pc:text-row pc:text-ink">
    <input
      id="query"
      class="pc:m-2.5 pc:rounded pc:border pc:border-rule pc:bg-surface pc:px-2.5 pc:py-2 pc:font-ui pc:text-head pc:text-ink pc:outline-none pc:focus:border-now"
      type="text"
      placeholder="Task"
      autocomplete="off"
      spellcheck="false"
      autofocus
    />
    <p id="error" class="pc:mx-2.5 pc:mt-0 pc:mb-1.5 pc:text-danger" hidden></p>
    <ul id="tasks" class="pc:m-0 pc:flex pc:list-none pc:flex-col pc:gap-0.5 pc:overflow-y-auto pc:px-2.5 pc:pt-0 pc:pb-2.5"></ul>
  </body>
</html>
