[package]
name = "punchcard-core"
version = "0.0.1"
description = "Punchcard block rules shared by stint and the wasm build"
authors = ["Issac Roy"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[features]
test-support = ["dep:serde", "dep:serde_json"]

[dependencies]
# No `clock` feature, so nothing in the core can read the current time.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
