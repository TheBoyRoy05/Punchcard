[package]
name = "punchcard-wasm"
version = "0.0.1"
description = "Punchcard block rules for JavaScript through wasm-bindgen"
authors = ["Issac Roy"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
crate-type = ["cdylib"]

[dependencies]
punchcard-core = { path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "0.2.130"

# wasm-pack applies the `custom` key to every `--profile <name>` build.
# wasm-opt drops the name section unless asked to keep debug info.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz", "--strip-producers"]
