[package]
name = "punch"
version = "0.0.1"
description = "Punchcard timer and timeline"
authors = ["Issac Roy"]
license = "MIT"
repository = "https://github.com/TheBoyRoy05/Punchcard"
edition = "2024"
default-run = "punch"
rust-version = "1.90"

[workspace]
members = ["core", "wasm"]
resolver = "3"

# Size over speed for the wasm build only; punch keeps the plain release profile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lib]
name = "punch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
percent-encoding = "2.3.2"
punchcard-core = { path = "core" }
notify-rust = "4.19.0"
open = "5.4.5"
tempfile = "3"

[dev-dependencies]
punchcard-core = { path = "core", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
objc2 = "0.6.5"
