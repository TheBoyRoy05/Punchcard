[package]
name = "stint"
version = "0.0.1"
description = "Punchcard timer, picker and timeline"
authors = ["Issac Roy"]
license = "MIT"
repository = "https://github.com/TheBoyRoy05/Punchcard"
edition = "2024"
rust-version = "1.90"

[lib]
name = "stint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
